<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="孕期飲食">
  <title>孕期飲食紀錄</title>
  <style>
    :root {
      --primary: #3D6B4E;
      --primary-light: #EAF2EC;
      --bg: #F8F9FA;
      --card: #FFFFFF;
      --text: #2D3748;
      --text-muted: #718096;
      --border: #E2E8F0;
      --danger: #E53E3E;
      --warning: #D69E2E;
    }
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 700; text-align: center; margin: 8px 0 16px; color: var(--primary); }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }
    .field-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .form-group { margin-bottom: 16px; }

    /* 編輯模式提示條 */
    .edit-banner {
      display: none;
      background: #FEFCBF;
      color: #744210;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 14px;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }

    /* 照片上傳 */
    .photo-box {
      border: 2px dashed #CBD5E0;
      border-radius: 12px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      background: #FAFAFA;
      overflow: hidden;
    }
    .photo-box img { width: 100%; max-height: 240px; object-fit: contain; display: none; }
    .photo-box span { font-size: 0.85rem; color: #718096; padding: 20px; text-align: center; }
    .clear-photo {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
