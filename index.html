<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="孕期飲食">
  <title>孕期飲食紀錄</title>
  <style>
    :root {
      --primary: #3D6B4E;
      --primary-light: #EAF2EC;
      --bg: #F8F9FA;
      --card: #FFFFFF;
      --text: #2D3748;
      --text-muted: #718096;
      --border: #E2E8F0;
      --danger: #E53E3E;
    }
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 700; text-align: center; margin: 8px 0 16px; color: var(--primary); }
    
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      position: relative;
    }
    .field-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .form-group { margin-bottom: 16px; }

    /* 編輯模式提示條 */
    .edit-banner {
      display: none;
      background: #FEFCBF;
      color: #744210;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 14px;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }

    /* 照片上傳 */
    .photo-box {
      border: 2px dashed #CBD5E0;
      border-radius: 12px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      background: #FAFAFA;
      overflow: hidden;
    }
    .photo-box img { width: 100%; max-height: 240px; object-fit: contain; display: none; }
    .photo-box span { font-size: 0.85rem; color: #718096; padding: 20px; text-align: center; }
    .clear-photo {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: #FFF;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }

    input[type="datetime-local"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--text);
      background: #FFF;
    }
    textarea { min-height: 55px; resize: vertical; }

    /* 按鈕與標籤 */
    .chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 7px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #FFF;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .chip.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }

    .form-actions { display: flex; gap: 8px; }
    .btn-submit {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #FFF;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-submit:active { opacity: 0.85; }
    .btn-cancel {
      display: none;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #FFF;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 頂部操作與列表 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .btn-group { display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 10px;
      font-size: 0.78rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #FFF;
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
    }

    .item-card {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    .item-card:last-child { border-bottom: none; }
    .item-img {
      width: 75px;
      height: 75px;
      border-radius: 8px;
      object-fit: cover;
      background: #EDF2F7;
      flex-shrink: 0;
    }
    .item-content { flex: 1; font-size: 0.82rem; padding-right: 65px; }
    .item-time { font-weight: 700; color: var(--primary); margin-bottom: 4px; }
    .tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #EDF2F7;
      margin-right: 4px;
      margin-bottom: 4px;
      font-size: 0.75rem;
    }
    .tag-walk { background: #E6FFFA; color: #234E52; border: 1px solid #B2F5EA; }
    
    .item-ops {
      position: absolute;
      top: 8px;
      right: 0;
      display: flex;
      gap: 6px;
    }
    .btn-card-op {
      background: none;
      border: none;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 4px;
      font-weight: 600;
    }
    .btn-edit { color: var(--primary); }
    .btn-del { color: var(--danger); }

    .backup-box {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      font-size: 0.78rem;
    }

    /* 報表模式 */
    #reportView { display: none; }
    body.report-active #mainView { display: none; }
    body.report-active #reportView { display: block; }
    
    /* 核心調整：在醫師報表模式下，隱藏編輯與刪除按鈕 */
    body.report-active .item-ops {
      display: none !important;
    }
    body.report-active .item-content {
      padding-right: 0 !important;
    }

    .report-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2D3748;
      color: #FFF;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    /* Toast 浮動提示 */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #FFF;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
<div class="container">
  <div id="mainView">
    <h1>🥗 孕期飲食與生活紀錄</h1>

    <div class="card" id="formCard">
      <div class="edit-banner" id="editBanner">
        <span>✏️ 正在編輯紀錄...</span>
        <button type="button" onclick="cancelEdit()" style="background:none;border:none;font-weight:bold;cursor:pointer;">✕ 取消</button>
      </div>

      <div class="form-group">
        <div class="field-title">1. 拍照/上傳照片（手掌入鏡當比例尺）</div>
        <div class="photo-box" id="photoDrop" onclick="document.getElementById('fileInput').click()">
          <span id="photoHint">📷 點擊拍照或從相簿選擇照片</span>
          <img id="previewImg" alt="預覽">
          <button type="button" class="clear-photo" id="clearBtn" onclick="removePhoto(event)">✕</button>
          <input type="file" id="fileInput" accept="image/*" style="display:none">
        </div>
      </div>

      <div class="form-group">
        <div class="field-title">2. 用餐時間與餐別</div>
        <input type="datetime-local" id="mealTime">
        <div class="chip-list" id="mealTypes" style="margin-top: 8px;">
          <span class="chip active" data-v="早餐">早餐</span>
          <span class="chip" data-v="早點心">早點心</span>
          <span class="chip" data-v="午餐">午餐</span>
          <span class="chip" data-v="午點心">午點心</span>
          <span class="chip" data-v="晚餐">晚餐</span>
          <span class="chip" data-v="宵夜">宵夜</span>
        </div>
      </div>

      <div class="form-group">
        <div class="field-title">3. 進食順序</div>
        <div class="chip-list" id="mealOrders">
          <span class="chip active" data-v="菜 ➡️ 肉 ➡️ 澱粉">菜 ➡️ 肉 ➡️ 澱粉</span>
          <span class="chip" data-v="肉/蛋 ➡️ 菜 ➡️ 澱粉">肉/蛋 ➡️ 菜 ➡️ 澱粉</span>
          <span class="chip" data-v="混著吃 / 一起吃">混著吃</span>
          <span class="chip" data-v="點心 / 單純飲品">點心 / 飲品</span>
        </div>
      </div>

      <div class="form-group">
        <div class="field-title">4. 飯後走動狀況</div>
        <div class="chip-list" id="walkTypes">
          <span class="chip" data-v="尚未走動（稍後補記）">⏳ 尚未走動</span>
          <span class="chip active" data-v="散步走動 15～20 分">🚶‍♀️ 散步 15～20 分</span>
          <span class="chip" data-v="微走動（家務約 10 分）">🧹 微走動 10 分</span>
          <span class="chip" data-v="無走動（久坐/休息）">🛋️ 久坐 / 休息</span>
        </div>
      </div>

      <div class="form-group">
        <div class="field-title">5. 備註（份量 / 食材 / 身體感受）</div>
        <textarea id="notes" placeholder="例：糙米半碗、蒸魚一手掌、高麗菜一拳頭"></textarea>
      </div>

      <div class="form-actions">
        <button class="btn-submit" id="submitBtn" onclick="saveRecord()">儲存這餐紀錄</button>
        <button class="btn-cancel" id="cancelBtnBottom" onclick="cancelEdit()">取消</button>
      </div>
    </div>

    <!-- 清單 -->
    <div class="card">
      <div class="list-header">
        <strong style="font-size: 0.95rem;">📋 飲食紀錄 (<span id="recordCount">0</span>)</strong>
        <div class="btn-group">
          <button class="btn-action" onclick="toggleReport(true)">📄 醫師報表</button>
          <button class="btn-action" onclick="clearAllRecords()" style="color:var(--danger);">清空</button>
        </div>
      </div>
      <div id="recordList">
        <div style="text-align:center; color:var(--text-muted); padding: 20px;">載入中...</div>
      </div>
      
      <div class="backup-box">
        <button class="btn-action" onclick="exportBackup()">📥 匯出備份</button>
        <button class="btn-action" onclick="document.getElementById('importInput').click()">📤 匯入備份</button>
        <input type="file" id="importInput" accept=".json" style="display:none" onchange="importBackup(event)">
      </div>
    </div>
  </div>

  <!-- 醫師報表模式 -->
  <div id="reportView">
    <div class="report-bar">
      <span>📋 產檢與營養門診專用報表</span>
      <button class="btn-action" onclick="toggleReport(false)" style="color:#000;">✕ 返回編輯</button>
    </div>
    <div class="card" id="reportContent"></div>
  </div>
</div>
<div id="toast"></div>

<script>
  let db;
  let currentBase64 = '';
  let editingId = null;

  const dbReq = indexedDB.open('PregnancyDietTracker', 3);
  dbReq.onupgradeneeded = function(e) {
    const d = e.target.result;
    if (!d.objectStoreNames.contains('logs')) {
      d.createObjectStore('logs', { keyPath: 'id' });
    }
  };
  dbReq.onsuccess = function(e) {
    db = e.target.result;
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist();
    }
    renderList();
  };
  dbReq.onerror = function() {
    renderList();
  };

  function setNowTime() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('mealTime').value = now.toISOString().slice(0, 16);
  }
  setNowTime();
  window.addEventListener('pageshow', () => { if (!editingId) setNowTime(); });

  function bindChips(id) {
    const parent = document.getElementById(id);
    parent.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', () => {
        parent.querySelectorAll('.chip').forEach(item => item.classList.remove('active'));
        c.classList.add('active');
      });
    });
  }
  bindChips('mealTypes');
  bindChips('mealOrders');
  bindChips('walkTypes');

  function setChipValue(parentId, value) {
    const parent = document.getElementById(parentId);
    let matched = false;
    parent.querySelectorAll('.chip').forEach(c => {
      if (c.dataset.v === value) {
        c.classList.add('active');
        matched = true;
      } else {
        c.classList.remove('active');
      }
    });
    if (!matched) {
      const first = parent.querySelector('.chip');
      if (first) first.classList.add('active');
    }
  }

  document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function() {
      const maxSide = 600;
      let w = img.width, h = img.height;
      if (w > maxSide || h > maxSide) {
        if (w > h) { h = Math.round((h * maxSide) / w); w = maxSide; }
        else { w = Math.round((w * maxSide) / h); h = maxSide; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      currentBase64 = canvas.toDataURL('image/jpeg', 0.6);

      const preview = document.getElementById('previewImg');
      preview.src = currentBase64;
      preview.style.display = 'block';
      document.getElementById('photoHint').style.display = 'none';
      document.getElementById('clearBtn').style.display = 'flex';
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  function removePhoto(e) {
    if (e) e.stopPropagation();
    currentBase64 = '';
    document.getElementById('previewImg').style.display = 'none';
    document.getElementById('previewImg').src = '';
    document.getElementById('photoHint').style.display = 'block';
    document.getElementById('clearBtn').style.display = 'none';
    document.getElementById('fileInput').value = '';
  }

  function saveRecord() {
    const mealTime = document.getElementById('mealTime').value;
    const mealType = document.querySelector('#mealTypes .active').dataset.v;
    const order = document.querySelector('#mealOrders .active').dataset.v;
    const walk = document.querySelector('#walkTypes .active').dataset.v;
    const notes = document.getElementById('notes').value.trim();

    if (!currentBase64 && !notes) {
      showToast('請拍張照片或填寫餐點備註喔！');
      return;
    }

    const data = {
      id: editingId ? editingId : Date.now(),
      timestamp: new Date(mealTime).getTime(),
      dateStr: mealTime.replace('T', ' '),
      mealType,
      order,
      walk,
      notes,
      image: currentBase64
    };

    if (db) {
      const tx = db.transaction('logs', 'readwrite');
      tx.objectStore('logs').put(data);
    }

    try {
      let localList = JSON.parse(localStorage.getItem('pregnancy_diet_logs') || '[]');
      if (editingId) {
        localList = localList.map(item => item.id === editingId ? data : item);
      } else {
        localList.push(data);
      }
      localStorage.setItem('pregnancy_diet_logs', JSON.stringify(localList));
    } catch(err) {
      console.warn('localStorage 儲存警示');
    }

    showToast(editingId ? '✅ 紀錄已成功更新！' : '✅ 紀錄已成功儲存！');
    cancelEdit();
    renderList();
  }

  function startEdit(id) {
    const localList = JSON.parse(localStorage.getItem('pregnancy_diet_logs') || '[]');
    const record = localList.find(r => r.id === id);
    if (!record) return;

    editingId = id;
    if (record.dateStr) {
      document.getElementById('mealTime').value = record.dateStr.replace(' ', 'T');
    }
    document.getElementById('notes').value = record.notes || '';

    setChipValue('mealTypes', record.mealType);
    setChipValue('mealOrders', record.order);
    setChipValue('walkTypes', record.walk);

    if (record.image) {
      currentBase64 = record.image;
      const preview = document.getElementById('previewImg');
      preview.src = record.image;
      preview.style.display = 'block';
      document.getElementById('photoHint').style.display = 'none';
      document.getElementById('clearBtn').style.display = 'flex';
    } else {
      removePhoto();
    }

    document.getElementById('editBanner').style.display = 'flex';
    document.getElementById('cancelBtnBottom').style.display = 'block';
    document.getElementById('submitBtn').textContent = '💾 更新這餐紀錄';

    document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
  }

  function cancelEdit() {
    editingId = null;
    document.getElementById('notes').value = '';
    removePhoto();
    setNowTime();
    setChipValue('walkTypes', '散步走動 15～20 分');

    document.getElementById('editBanner').style.display = 'none';
    document.getElementById('cancelBtnBottom').style.display = 'none';
    document.getElementById('submitBtn').textContent = '儲存這餐紀錄';
  }

  function renderList() {
    if (db) {
      const tx = db.transaction('logs', 'readonly');
      const store = tx.objectStore('logs');
      store.getAll().onsuccess = function(e) {
        let records = e.target.result;
        if (!records || records.length === 0) {
          records = JSON.parse(localStorage.getItem('pregnancy_diet_logs') || '[]');
        }
        displayRecords(records);
      };
    } else {
      const records = JSON.parse(localStorage.getItem('pregnancy_diet_logs') || '[]');
      displayRecords(records);
    }
  }

  function displayRecords(records) {
    records.sort((a,b) => b.timestamp - a.timestamp);
    document.getElementById('recordCount').textContent = records.length;
    const listEl = document.getElementById('recordList');
    const reportEl = document.getElementById('reportContent');

    if (records.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 20px;">尚無紀錄，拍下第一餐吧！</div>';
      reportEl.innerHTML = '<div style="text-align:center; padding: 20px;">尚無紀錄</div>';
      return;
    }

    const html = records.map(r => `
      <div class="item-card">
        ${r.image ? `<img src="${r.image}" class="item-img">` : `<div class="item-img" style="display:flex;align-items:center;justify-content:center;font-size:0.7rem;color:#A0AEC0;">無照片</div>`}
        <div class="item-content">
          <div class="item-ops">
            <button class="btn-card-op btn-edit" onclick="startEdit(${r.id})">編輯</button>
            <button class="btn-card-op btn-del" onclick="deleteItem(${r.id})">刪除</button>
          </div>
          <div class="item-time">${r.dateStr} 【${r.mealType}】</div>
          <div>
            <span class="tag">${r.order}</span>
            <span class="tag tag-walk">${r.walk}</span>
          </div>
          ${r.notes ? `<div style="margin-top:4px; color:#4A5568;">💬 ${r.notes}</div>` : ''}
        </div>
      </div>
    `).join('');

    listEl.innerHTML = html;
    reportEl.innerHTML = html;
  }

  function deleteItem(id) {
    if (confirm('確定要刪除這筆紀錄嗎？')) {
      if (editingId === id) cancelEdit();
      if (db) {
        const tx = db.transaction('logs', 'readwrite');
        tx.objectStore('logs').delete(id);
      }
      const localList = JSON.parse(localStorage.getItem('pregnancy_diet_logs') || '[]');
      const filtered = localList.filter(item => item.id !== id);
      localStorage.setItem('pregnancy_diet_logs', JSON.stringify(filtered));
      showToast('已刪除紀錄');
      renderList();
    }
  }

  function clearAllRecords() {
    if (confirm('確定要清空所有紀錄嗎？清空後無法復原喔！')) {
      cancelEdit();
      if (db) {
        const tx = db.transaction('logs', 'readwrite');
        tx.objectStore('logs').clear();
      }
      localStorage.removeItem('pregnancy_diet_logs');
      showToast('已清空所有紀錄');
      renderList();
    }
  }

  function toggleReport(show) {
    if (show) {
      document.body.classList.add('report-active');
      window.scrollTo(0, 0);
    } else {
      document.body.classList.remove('report-active');
    }
  }

  function exportBackup() {
    const records = JSON.parse(localStorage.getItem('pregnancy_diet_logs') || '[]');
    if (records.length === 0) {
      showToast('目前沒有可備份的紀錄');
      return;
    }
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `孕期飲食紀錄備份_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('備份檔案已下載！');
  }

  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const imported = JSON.parse(event.target.result);
        if (Array.isArray(imported)) {
          localStorage.setItem('pregnancy_diet_logs', JSON.stringify(imported));
          if (db) {
            const tx = db.transaction('logs', 'readwrite');
            const store = tx.objectStore('logs');
            imported.forEach(item => store.put(item));
          }
          showToast('備份匯入成功！');
          renderList();
        }
      } catch(err) {
        alert('匯入失敗：檔案格式不正確');
      }
    };
    reader.readAsText(file);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2200);
  }
</script>
</body>
</html>
